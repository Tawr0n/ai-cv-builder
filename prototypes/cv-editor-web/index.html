<!doctype html>
<!--
  WEB PROTOTYPE (desktop) — throwaway. Builds on the agreed mobile prototype below (kept verbatim for < 900px).
  At >= 900px three structurally different desktop editors are switchable with #A, #B, #C (or ?variant=) (or the bar at
  the bottom, or the ← → keys):  A = Split editor | B = Canvas + inspector | C = Copilot.
  Same in-memory state and Sim panel as the mobile prototype. Never merge into main.

  (original header) PROTOTYPE — throwaway. Answers wayfinder ticket "Mobile-friendly CV editor UX" (#11).
  Agreed shape (variant C): paper preview + bottom tabs CV | Edit | Questions. Variants A
  (inline document) and B (section tabs + sheets) were dropped; they live in this branch's
  history (commit 0fddffd). Other screens: CV list, New CV, Generating, Failed.
  No backend: all state is in memory; the "Sim" panel forces states (save error, failures).
  Open on a phone or in a 375px viewport. Never merge into main.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Editor Web Prototype</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --ink: #1c1c1e; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #2f5bea; --accent-ink: #fff; --warn-bg: #fff6dc; --warn-line: #f0c94a; --warn-ink: #6b5200;
    --err-bg: #fde8e8; --err-ink: #9b1c1c; --ok: #1d7a46; --pending-bg: #e8efff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d9d6; font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  .phone { max-width: 420px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; padding-bottom: 240px; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  header.top h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header.top .sub { font-size: 12px; color: var(--muted); font-weight: normal; display: block; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 14px; min-height: 40px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; min-height: 0; }
  button.icon { padding: 6px 10px; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: #fff; }
  textarea { resize: vertical; min-height: 64px; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .pad { padding: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eee; color: var(--muted); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.err { background: var(--err-bg); color: var(--err-ink); }
  .chip.ok { background: #e3f4ea; color: var(--ok); }
  .chip.run { background: var(--pending-bg); color: var(--accent); }
  .q { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .q.pending { background: var(--pending-bg); border-color: #b9cbff; }
  .q .qt { font-weight: 600; color: var(--warn-ink); }
  .q.pending .qt { color: var(--accent); }
  .banner { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .banner.err { background: var(--err-bg); color: var(--err-ink); }
  .banner.run { background: var(--pending-bg); color: var(--accent); }
  .shimmer { position: relative; opacity: .55; pointer-events: none; }
  .shimmer::after { content: "Updating…"; position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--accent); background: var(--pending-bg); padding: 1px 6px; border-radius: 99px; }
  .edited { font-size: 11px; color: var(--muted); }
  h2.sec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  ul.b { margin: 6px 0 0; padding-left: 18px; }
  ul.b li { margin: 2px 0; }
  .save { font-size: 12px; }
  .save.err { color: var(--err-ink); }
  .save.ok { color: var(--ok); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; }
  .seg button.on { background: var(--ink); color: #fff; }
  .steps li { margin: 6px 0; list-style: none; }
  .steps { padding: 0; }
  .paper { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.12); padding: 22px 20px; margin: 12px; font-family: Georgia, serif; font-size: 13px; }
  .paper h3 { font: 600 11px/1 -apple-system, system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin: 16px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .paper .pen { font: 12px -apple-system, system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--accent); border: 0; background: none; padding: 0 4px; min-height: 0; }
  .hl { background: #fff1b8; outline: 2px solid var(--warn-line); border-radius: 3px; }
  .qmark { display: inline-block; font: 600 10px -apple-system, system-ui, sans-serif; color: var(--warn-ink); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 99px; padding: 0 5px; margin-left: 4px; cursor: pointer; }
  .li { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
  .li textarea, .li input { flex: 1; min-height: 40px; }
  .x { min-height: 40px; padding: 0 10px; color: var(--muted); }
  .add { width: 100%; border-style: dashed; color: var(--accent); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chips span { background: #eef1f6; border-radius: 99px; padding: 4px 4px 4px 10px; font-size: 14px; display: inline-flex; align-items: center; gap: 2px; }
  .chips span button { border: 0; background: none; min-height: 0; padding: 0 6px; color: var(--muted); }
  .chead { display: flex; align-items: center; margin-bottom: -4px; }
  .chead b { flex: 1; font-size: 12px; color: var(--muted); font-weight: 600; }
  .loader { position: sticky; top: 70px; z-index: 3; margin: 12px; background: var(--card); border: 1px solid #b9cbff; border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 14px rgba(47,91,234,.15); }
  .spin { width: 26px; height: 26px; border: 3px solid var(--pending-bg); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .paper.busy { opacity: .6; }
  .flash { animation: flash 2.5s ease-out; }
  @keyframes flash { 0%, 40% { background: #d9f2e3; } 100% { background: transparent; } }
  del.dd { background: #fde8e8; color: #9b1c1c; text-decoration: line-through; }
  ins.di { background: #d9f2e3; color: #1d5e36; text-decoration: none; }
  .changed { border-left: 3px solid #2fa865; padding-left: 6px; margin-left: -9px; cursor: pointer; }
  .changed.sel { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .rbar { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); width: min(420px,100%); background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 12px rgba(0,0,0,.08); padding: 8px 12px; z-index: 6; }
  .rbar .row button { min-height: 36px; padding: 6px 12px; }
  .bnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(420px,100%); background: var(--card); border-top: 1px solid var(--line); display: flex; z-index: 6; }
  .bnav button { flex: 1; border: 0; border-radius: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); font-size: 13px; }
  .bnav button.on { color: var(--accent); font-weight: 600; }
  /* ===== desktop (>= 900px): three variants ===== */
  .grow { flex: 1; }
  #vsw { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; gap: 10px; align-items: center; background: #111; color: #fff; border-radius: 99px; padding: 5px 8px; box-shadow: 0 6px 20px rgba(0,0,0,.35); font-size: 13px; }
  #vsw:empty { display: none; }
  #vsw button { background: #333; color: #fff; border: 0; border-radius: 99px; min-height: 30px; padding: 2px 14px; }
  @media (min-width: 900px) {
    .phone.wide { max-width: 560px; margin-top: 28px; min-height: 0; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.14); padding-bottom: 24px; overflow: hidden; }
    #sim { top: auto; bottom: 14px; right: auto; left: 14px; display: flex; flex-direction: column-reverse; align-items: flex-start; }
    #sim .panel { margin: 0 0 6px; max-height: 60vh; }
  }
  @media (max-width: 899px) { #vsw { display: none; } }
  body.vA { background: #e4e7ee; } body.vB { background: #12141c; } body.vC { background: #f1ebe0; }
  .dwrap { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); --hover: rgba(47,91,234,.07); }
  .dtop { display: flex; align-items: center; gap: 10px; padding: 10px 20px; background: var(--card); border-bottom: 1px solid var(--line); z-index: 5; }
  .dtop h1 { font-size: 16px; margin: 0; line-height: 1.25; }
  .dtop .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .dwrap .banner { margin: 0; border-radius: 0; }
  .dgrid { flex: 1; min-height: 0; display: grid; }
  .scr { overflow: auto; min-height: 0; padding-bottom: 76px; }
  .dwrap .paper { max-width: 780px; margin: 24px auto; padding: 52px 60px; font-size: 14.5px; line-height: 1.55; box-shadow: 0 2px 16px rgba(0,0,0,.14); }
  .dwrap .paper div[id^="p-"] { border-radius: 4px; transition: background .12s; }
  .dwrap .paper div[id^="p-"]:hover { background: var(--hover); cursor: pointer; }
  .dwrap .loader { top: 8px; max-width: 780px; margin: 12px auto; }
  .dwrap .rbar { position: sticky; bottom: 62px; left: auto; transform: none; width: min(780px, calc(100% - 24px)); margin: 0 auto; border: 1px solid var(--line); border-radius: 12px; }
  .picked { outline: 2px solid var(--accent); outline-offset: 3px; background: var(--hover); }
  .badge { background: var(--warn-line); color: var(--warn-ink); border-radius: 99px; font-size: 11px; font-weight: 700; padding: 0 7px; margin-left: 4px; }
  /* A: split editor */
  .a-grid { grid-template-columns: minmax(440px, 540px) 1fr; }
  .a-edit { background: var(--bg); border-right: 1px solid var(--line); }
  .a-prev { background: #d9dde6; }
  .a-bar { position: sticky; top: 0; z-index: 4; background: var(--card); border-bottom: 1px solid var(--line); }
  .a-tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
  .a-tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 8px 8px 0 0; background: none; color: var(--muted); padding: 8px 14px; min-height: 0; }
  .a-tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .a-nav { display: flex; gap: 2px; padding: 4px 10px 6px; flex-wrap: wrap; }
  .a-edit h2.sec { scroll-margin-top: 90px; }
  /* B: canvas + inspector (dark chrome) */
  .vB { --accent: #6d5ef5; --pending-bg: #ece9ff; --bg: #f5f4f8; --hover: rgba(109,94,245,.1); }
  .vB .dtop { background: #171923; color: #e8e9f0; border-bottom: 1px solid #2a2e3d; }
  .vB .dtop .sub { color: #8d92a6; }
  .vB .dtop button { background: #262a3a; color: #e8e9f0; border-color: #363b50; }
  .vB .dtop button.primary { background: var(--accent); border-color: var(--accent); }
  .vB .dtop button:disabled { opacity: .35; }
  .b-grid { grid-template-columns: 270px 1fr 400px; }
  .b-rail { background: #171923; color: #e8e9f0; padding: 8px 10px 76px; }
  .b-rail .gh { display: flex; align-items: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8d92a6; margin: 16px 6px 4px; }
  .b-rail .gh button { margin-left: auto; background: none; border: 0; color: #a79dff; min-height: 0; padding: 0 4px; font-size: 12px; letter-spacing: 0; text-transform: none; }
  .oi { display: flex; width: 100%; text-align: left; border: 0; background: none; color: #cfd2e0; border-radius: 8px; padding: 8px 10px; gap: 6px; align-items: center; min-height: 0; }
  .oi:hover { background: #222637; } .oi.on { background: var(--accent); color: #fff; }
  .oi b { font-weight: 600; font-size: 14px; } .oi small { display: block; color: #8d92a6; font-size: 12px; } .oi.on small { color: #ddd8ff; }
  .dot { font-size: 11px; border-radius: 99px; padding: 1px 7px; font-weight: 700; flex: none; }
  .dot.w { background: var(--warn-bg); color: var(--warn-ink); } .dot.g { background: #d9f2e3; color: #1d5e36; } .dot.e { background: #2c3145; color: #9aa0b8; }
  .b-canvas { background: #2a2e3d; }
  .b-canvas .paper { box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .b-insp { background: var(--card); border-left: 1px solid var(--line); }
  .ihead { position: sticky; top: 0; z-index: 3; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
  .ihead small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .ihead b { font-size: 16px; }
  /* C: copilot */
  .vC { --accent: #0f7b6c; --pending-bg: #dff3ee; --bg: #faf7f2; --line: #e6dfd3; --hover: rgba(15,123,108,.08); }
  .vC .dtop h1 { font: 600 19px Georgia, serif; }
  .c-grid { grid-template-columns: 1fr 410px; }
  .c-doc { background: #ece5d8; }
  .c-pilot { background: var(--card); border-left: 1px solid var(--line); padding: 0 16px 0; }
  .c-pilot .ph { position: sticky; top: 0; background: var(--card); z-index: 3; padding: 14px 0 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .c-pilot .av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; flex: none; }
  .bub { background: #f4efe6; border-radius: 16px 16px 16px 4px; padding: 12px 14px; margin: 12px 0; }
  .bub.q { background: #fff; border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .bub .q { border: 0; background: none; padding: 0; margin: 6px 0 0; }
  .chg { display: flex; align-items: center; gap: 6px; background: #eef8f2; border: 1px solid #bfe3cd; border-radius: 12px; padding: 8px 10px; margin: 8px 0; }
  .chg.sel { outline: 2px solid var(--accent); }
  .pfoot { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 0 64px; margin-top: 12px; }
  .overlay { position: fixed; inset: 0; background: rgba(20,20,25,.45); display: flex; align-items: center; justify-content: center; z-index: 30; }
  .dialog { background: var(--bg); border-radius: 18px; width: min(580px, 92vw); max-height: 84vh; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
  .dialog.scr { padding-bottom: 0; }
  .dhead { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 18px; display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .dhead b { flex: 1; font: 600 17px Georgia, serif; }
  /* prototype chrome (not part of the design) */
  #sim { position: fixed; top: 120px; right: 8px; z-index: 51; font-size: 12px; }
  #sim > button { background: #111; color: #fff; border: 0; border-radius: 99px; min-height: 30px; padding: 4px 12px; }
  #sim .panel { background: #111; color: #eee; border-radius: 12px; padding: 10px; margin-top: 6px; width: 290px; max-height: 70vh; overflow: auto; }
  #sim .panel button { background: #333; color: #fff; border: 0; min-height: 28px; padding: 3px 8px; margin: 2px; font-size: 12px; border-radius: 6px; }
  #sim pre { white-space: pre-wrap; font-size: 10.5px; color: #9fe39f; margin: 8px 0 0; }
  #sim label { display: block; margin: 4px 0; }
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div id="sim"></div>
<div id="vsw"></div>
<script>
// ---------- in-memory state ----------

const initialCv = () => ({
  contact: { id: 'contact', rev: 1, edited: false, name: 'Olena Kovalenko', email: 'olena.k@example.com', phone: '+380 67 123 4567', location: 'Lviv, Ukraine', links: ['https://github.com/olenak'] },
  summary: { id: 'summary', rev: 1, edited: false, text: 'Backend engineer with 6 years of Node.js and PostgreSQL experience, focused on payment systems and high-load APIs. Targeting a Senior Backend Engineer role.' },
  experience: [
    { id: 'e1', rev: 1, edited: false, title: 'Backend Engineer', org: 'PayFlow', dates: '2021 – present', bullets: ['Built the payment authorisation service in NestJS and PostgreSQL', 'Cut p95 latency of the checkout API by moving reads to a replica', 'Mentored two junior engineers'] },
    { id: 'e2', rev: 1, edited: false, title: 'Freelance Node.js developer', org: null, dates: null, bullets: ['Delivered REST APIs for small e-commerce clients'] },
    { id: 'e3', rev: 1, edited: false, title: 'Junior Developer', org: 'SoftServe', dates: '2018 – 2020', bullets: ['Maintained internal reporting tools in Express'] },
  ],
  education: [ { id: 'ed1', rev: 1, edited: false, degree: 'BSc Computer Science', school: 'Lviv Polytechnic', dates: null } ],
  skills: { id: 'skills', rev: 1, edited: false, items: ['Node.js', 'TypeScript', 'NestJS', 'PostgreSQL', 'Redis', 'Docker'] },
});
const initialQuestions = () => ([
  { id: 'q1', anchor: { section: 'experience', item: 'e1', field: 'bullets' }, text: 'How much did the p95 latency of the checkout API drop?', status: 'open', answer: '' },
  { id: 'q2', anchor: { section: 'experience', item: 'e2', field: 'dates' }, text: 'When did you freelance, and for which clients or platform?', status: 'open', answer: '' },
  { id: 'q3', anchor: { section: 'education', item: 'ed1', field: 'dates' }, text: 'Did you complete the degree? In which year?', status: 'open', answer: '' },
  { id: 'q4', anchor: { section: 'skills' }, text: 'Do you have hands-on experience with any message queue (Kafka, RabbitMQ, SQS)?', status: 'open', answer: '' },
]);

let S = {
  screen: 'editor',            // list | new | generating | failed | editor
  newSource: 'pdf',
  generation: null,            // { kind: 'initial'|'answer', step, status, errorCode, scope: [itemIds] }
  cv: initialCv(),
  questions: initialQuestions(),
  saves: {},                   // itemId -> 'saving' | 'saved' | 'error'
  sim: { saveFails: false, answerRunFails: false, initialFails: false, open: false },
  ui: { cTab: 'preview', hl: null, rSel: null, focus: null },
};

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const itemById = id => {
  const c = S.cv;
  if (id === 'contact') return c.contact; if (id === 'summary') return c.summary; if (id === 'skills') return c.skills;
  return c.experience.find(x => x.id === id) || c.education.find(x => x.id === id);
};
const qFor = (id) => S.questions.filter(q => (q.anchor.item || q.anchor.section) === id && (q.status === 'open' || q.status === 'pending'));
const qForSection = (sec) => S.questions.filter(q => q.anchor.section === sec && (q.status === 'open' || q.status === 'pending'));
const pendingCount = () => S.questions.filter(q => q.status === 'pending').length;
const openCount = () => S.questions.filter(q => q.status === 'open' || q.status === 'pending').length;
const running = () => S.generation && (S.generation.status === 'queued' || S.generation.status === 'running');
const inScope = id => running() && S.generation.kind === 'answer' && S.generation.scope.includes(id);
const anchorLabel = a => {
  if (a.item) { const it = itemById(a.item); const name = it.title ? `${it.title}${it.org ? ' @ ' + it.org : ''}` : it.degree || a.section; return `${cap(a.section)} › ${name}${a.field ? ' › ' + a.field : ''}`; }
  return cap(a.section);
};
const cap = s => s[0].toUpperCase() + s.slice(1);

// Simulated item operation: one item, base rev, may fail.
function saveItem(id, patch) {
  const it = itemById(id); Object.assign(it, patch); // optimistic: keep the user's text on screen
  if (it.review) { it.review = false; delete it.prev; } // editing a changed item by hand accepts the change
  S.saves[id] = 'saving'; render();
  setTimeout(() => {
    if (S.sim.saveFails) { S.saves[id] = 'error'; render(); return; }
    it.rev++; it.edited = true;
    S.saves[id] = 'saved'; render();
  }, 700);
}
function setAnswer(qid, text) { const q = S.questions.find(x => x.id === qid); q.answer = text; q.status = text.trim() ? 'pending' : 'open'; render(); }
function dismissQ(qid) { S.questions.find(x => x.id === qid).status = 'dismissed'; render(); }

function startAnswerRun() {
  const pend = S.questions.filter(q => q.status === 'pending');
  const scope = [...new Set(pend.map(q => q.anchor.item || q.anchor.section))].filter(id => !itemById(id)?.edited);
  S.generation = { kind: 'answer', status: 'running', step: 'compose', scope };
  S.ui.cTab = 'preview'; S.ui.hl = null; window.scrollTo(0, 0); // show the CV being updated
  render();
  setTimeout(() => { if (S.generation) { S.generation.step = 'judge'; render(); } }, 1500);
  setTimeout(() => {
    if (S.sim.answerRunFails) { S.generation = { ...S.generation, status: 'failed', errorCode: 'llm_unavailable' }; render(); return; }
    for (const q of pend) {
      q.status = 'answered';
      const it = itemById(q.anchor.item || q.anchor.section);
      if (!it.review) { it.prev = snapshot(it); it.review = true; } // applied, but awaits Accept / Undo
      if (q.id === 'q1') it.bullets[1] = 'Cut p95 latency of the checkout API from 800 ms to 250 ms by moving reads to a replica';
      if (q.id === 'q2') { it.dates = q.answer.match(/\d{4}.*\d{4}/)?.[0] || '2020 – 2021'; it.org = 'Upwork'; }
      if (q.id === 'q3') it.dates = q.answer.match(/\d{4}/)?.[0] || '2018';
      if (q.id === 'q4') it.items = [...it.items, 'RabbitMQ'];
      it.rev++;
    }
    S.generation = { ...S.generation, status: 'succeeded' };
    render();
    setTimeout(() => { if (S.generation?.status === 'succeeded') { S.generation = null; render(); } }, 2500);
  }, 3500);
}
function startInitial() {
  S.screen = 'generating'; S.generation = { kind: 'initial', status: 'queued', step: null, started: Date.now() }; render();

  for (const [st, step, t] of steps) setTimeout(() => { if (S.screen === 'generating') { S.generation.status = st; S.generation.step = step; render(); } }, t);
  setTimeout(() => {
    if (S.screen !== 'generating') return;
    if (S.sim.initialFails) { S.generation = { kind: 'initial', status: 'failed', errorCode: 'llm_unavailable' }; S.screen = 'failed'; }
    else { S.generation = null; S.cv = initialCv(); S.questions = initialQuestions(); S.screen = 'editor'; }
    render();
  }, 7000);
}

// ---- review of AI changes: word diff against the item's previous snapshot ----
const ITEM_IDS = () => ['contact', 'summary', ...S.cv.experience.map(e => e.id), ...S.cv.education.map(e => e.id), 'skills'];
const changes = () => ITEM_IDS().filter(id => itemById(id).review);
function snapshot(it) { const { prev, review, ...rest } = it; return JSON.parse(JSON.stringify(rest)); }
function diffWords(a, b) {
  const tok = v => String(v ?? '').split(/(\s+|[,;·])/).filter(Boolean); // punctuation is its own token
  const x = tok(a), y = tok(b);
  const L = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = x.length - 1; i >= 0; i--) for (let j = y.length - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = '';
  while (i < x.length && j < y.length) {
    if (x[i] === y[j]) { out += esc(x[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { out += `<del class="dd">${esc(x[i++])}</del>`; }
    else { out += `<ins class="di">${esc(y[j++])}</ins>`; }
  }
  while (i < x.length) out += `<del class="dd">${esc(x[i++])}</del>`;
  while (j < y.length) out += `<ins class="di">${esc(y[j++])}</ins>`;
  return out;
}
// Field as HTML: plain when unchanged, word diff when the item awaits review.
const J = (v, sep) => Array.isArray(v) ? v.filter(Boolean).join(sep) : v;
const F = (it, f, sep = ' · ') => it.review && it.prev ? diffWords(J(it.prev[f], sep), J(it[f], sep)) : esc(J(it[f], sep));
const FB = it => it.bullets.filter(Boolean).map((b, k) => `<li>${it.review && it.prev ? diffWords(it.prev.bullets[k], b) : esc(b)}</li>`).join('')
  + (it.review && it.prev ? it.prev.bullets.slice(it.bullets.length).map(b => `<li><del class="dd">${esc(b)}</del></li>`).join('') : '');

function rStep(d) { const cs = changes(); const k = Math.max(0, cs.indexOf(S.ui.rSel)); rSelect(cs[(k + d + cs.length) % cs.length]); }

const mq = matchMedia('(min-width: 900px)');
const isDesk = () => mq.matches;
const VARIANTS = { A: 'Split editor', B: 'Canvas + inspector', C: 'Copilot' };
let variant = (location.hash.slice(1) || new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
if (!VARIANTS[variant]) variant = 'A';
function setVariant(v) { variant = v; S.ui.sel = null; S.ui.modal = null; try { location.hash = v; } catch (e) {} render(); }
function cycleV(d) { const k = Object.keys(VARIANTS); setVariant(k[(k.indexOf(variant) + d + k.length) % k.length]); }
addEventListener('keydown', e => {
  if (!isDesk() || S.screen !== 'editor' || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  const t = e.target; if (t.matches?.('input, textarea, select, [contenteditable]')) return;
  cycleV(e.key === 'ArrowRight' ? 1 : -1);
});
mq.addEventListener('change', () => render());

const MOBILE_HK = { pen: sec => `cGoEdit('${sec}')`, q: () => `S.ui.cTab='questions';render()`, click: () => '' };
const firstOf = sec => S.cv[sec][0]?.id || '';
const DESK = {
  A: { pen: sec => `aEdit('${sec}')`, q: () => `S.ui.cTab='questions';render()`, click: id => `aJump('${id}')` },
  B: { pen: sec => `bSel('${sec === 'experience' || sec === 'education' ? firstOf(sec) : sec}')`, q: id => `bSel('${id}')`, click: id => `bSel('${id}')` },
  C: { pen: sec => `cOpen('${sec}')`, q: () => `cPilotTop()`, click: id => `cOpen('${id}')` },
};
const HK = () => (isDesk() ? DESK[variant] : MOBILE_HK);
const jump = (eid, block = 'start') => requestAnimationFrame(() => document.getElementById(eid)?.scrollIntoView({ block, behavior: 'smooth' }));
const nm = id => { const it = itemById(id); return it.title ? it.title + (it.org ? ' · ' + it.org : '') : it.degree || cap(id); };
const secOf = id => (S.cv.experience.some(e => e.id === id) ? 'Experience' : S.cv.education.some(e => e.id === id) ? 'Education' : cap(id));

// ---------- desktop: shared pieces ----------
function itemForm(id) {
  const c = S.cv, it = itemById(id);
  if (id === 'contact') return field(it, 'name', 'Full name') + field(it, 'email', 'Email') + field(it, 'phone', 'Phone') + field(it, 'location', 'Location', 'City, country')
    + listEditor(it, 'links', 'Links', 'Add link', 'https://linkedin.com/in/…', false);
  if (id === 'summary') return `<textarea rows="8" onchange="queueSave('summary', { text: this.value })">${esc(it.text)}</textarea>`;
  if (id === 'skills') return `<div class="chips">${it.items.map((v, k) => `<span>${esc(v)}<button aria-label="Remove ${esc(v)}" onclick="removeListItem('skills','items',${k})">✕</button></span>`).join('')}</div>
    <div class="li"><input id="skill-new" placeholder="Add a skill" onkeydown="if(event.key==='Enter'){addSkill(this)}"><button class="x" onclick="addSkill(document.getElementById('skill-new'))">Add</button></div>`;
  const sec = c.experience.includes(it) ? 'experience' : 'education', head = removeHead(sec, it, c[sec].indexOf(it) + 1);
  if (sec === 'experience') return head + field(it, 'title', 'Title', 'e.g. Backend Engineer').replace('<input ', `<input id="${id}-first" `) + field(it, 'org', 'Organisation', 'Company, client or project') + field(it, 'dates', 'Dates', 'e.g. 2021 – present')
    + listEditor(it, 'bullets', 'Bullets', 'Add bullet', 'One concise achievement', true);
  return head + field(it, 'degree', 'Degree', 'e.g. BSc Computer Science').replace('<input ', `<input id="${id}-first" `) + field(it, 'school', 'School') + field(it, 'dates', 'Year(s)', 'e.g. 2014 – 2018');
}
const dCard = id => { const it = itemById(id); return `<div class="card ${inScope(id) ? 'shimmer' : ''}">${itemForm(id)}<div class="row" style="margin-top:8px">${it.edited ? '<span class="edited">✎ edited by you</span>' : ''}<span class="grow"></span>${saveLabel(id)}</div></div>`; };
function dHeader() {
  const n = openCount();
  return `<header class="dtop"><button class="icon" onclick="go('list')" aria-label="Back to my CVs">‹ CVs</button>
    <h1>Senior Backend Engineer<span class="sub">Olena Kovalenko · from PDF · ${running() ? 'updating…' : 'ready'}</span></h1><span class="grow"></span>
    ${n ? `<span class="chip warn">❓ ${n} open</span>` : '<span class="chip ok">All answered</span>'}${updateBtn()}${downloadBtn('⬇ Download PDF')}</header>${running() ? '' : runBanner()}`;
}
const paperPane = (id, cls, withBar = true) => `<main class="scr ${cls}" id="${id}">${cPaper()}${withBar ? rBar() : ''}</main>`;
// questions list; `locate` is the name of a global fn(itemId) that shows the anchor on the paper
function dQuestions(locate) {
  const qs = S.questions.filter(q => q.status === 'open' || q.status === 'pending');
  const done = S.questions.filter(q => q.status === 'answered' || q.status === 'dismissed');
  return `<div class="pad"><p class="muted">The AI didn't guess these. Answer what you can; nothing changes until you press “Update CV”.</p>
    ${qs.map(q => `<div class="card"><button class="link" style="padding:0;font-size:12px" onclick="${locate}('${q.anchor.item || q.anchor.section}')">📍 ${esc(anchorLabel(q.anchor))}</button>${questionBox(q, true)}</div>`).join('') || '<p class="muted">No open questions 🎉</p>'}
    ${done.length ? `<h2 class="sec">Done</h2>${done.map(q => `<div class="muted">✓ ${esc(q.text)} <i>(${q.status})</i></div>`).join('')}` : ''}</div>`;
}
function aLocate(id) { S.ui.hl = id; render(); jump('p-' + id, 'center'); setTimeout(() => { if (S.ui.hl === id) { S.ui.hl = null; render(); } }, 2500); }

// ---------- Variant A: split editor (form left, live paper right) ----------
function aEdit(sec) { S.ui.cTab = 'edit'; render(); jump('edit-sec-' + sec); }
function aJump(id) { S.ui.cTab = 'edit'; if (itemById(id).review) S.ui.rSel = id; render(); jump('edit-' + id, 'center'); }
function deskA() {
  const q = S.ui.cTab === 'questions', n = openCount();
  const nav = ['contact', 'summary', 'experience', 'education', 'skills'].map(s => `<button class="link" onclick="aEdit('${s}')">${cap(s)}</button>`).join('');
  return `<div class="dgrid a-grid"><section class="scr a-edit" id="sc-a-edit">
    <div class="a-bar"><div class="a-tabs"><button class="${q ? '' : 'on'}" onclick="S.ui.cTab='edit';render()">✎ Edit CV</button><button class="${q ? 'on' : ''}" onclick="S.ui.cTab='questions';render()">❓ Questions${n ? `<span class="badge">${n}</span>` : ''}</button></div>${q ? '' : `<div class="a-nav">${nav}</div>`}</div>
    ${q ? dQuestions('aLocate') : cEditTab()}</section>${paperPane('sc-a-prev', 'a-prev')}</div>`;
}

// ---------- Variant B: outline | canvas | inspector ----------
function bSel(id) { S.ui.sel = id || null; if (id && itemById(id)?.review) S.ui.rSel = id; render(); if (id) jump('p-' + id, 'center'); }
function bRail() {
  const c = S.cv;
  const item = (id, label, sub) => { const it = itemById(id), q = qFor(id).length;
    return `<button class="oi ${S.ui.sel === id ? 'on' : ''}" onclick="bSel('${id}')"><span class="grow"><b>${esc(label)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>${q ? `<span class="dot w">❓${q}</span>` : ''}${it.review ? '<span class="dot g">✨</span>' : ''}${it.edited ? '<span class="dot e">✎</span>' : ''}</button>`; };
  const gh = (t, add) => `<div class="gh">${t}${add ? `<button onclick="addItem('${add}')">+ Add</button>` : ''}</div>`;
  return `<nav class="scr b-rail" id="sc-b-rail">${gh('Basics')}${item('contact', 'Contact', c.contact.name)}${item('summary', 'Summary')}
    ${gh('Experience', 'experience')}${c.experience.map(e => item(e.id, e.title || 'New experience', [e.org, e.dates].filter(Boolean).join(' · '))).join('')}
    ${gh('Education', 'education')}${c.education.map(e => item(e.id, e.degree || 'New education', e.school)).join('')}
    ${gh('Skills')}${item('skills', 'Skills', c.skills.items.length + ' skills')}</nav>`;
}
function bInspector() {
  const id = S.ui.sel;
  if (!id) return `<aside class="scr b-insp" id="sc-b-insp"><div class="ihead"><div><small>Inspector</small><b>Nothing selected</b></div></div><div class="pad"><p class="muted">Click any part of the CV, or an entry on the left, to edit it here. Open questions are listed below.</p></div>${dQuestions('bSel')}</aside>`;
  const it = itemById(id), qs = qFor(id);
  return `<aside class="scr b-insp" id="sc-b-insp"><div class="ihead"><div class="grow"><small>${secOf(id)}</small><b>${esc(nm(id))}</b></div><button class="x" aria-label="Close" onclick="S.ui.sel=null;render()">✕</button></div>
    <div class="pad">${it.review ? `<div class="banner run" style="border-radius:10px">✨ The AI changed this. <span class="grow"></span></div><div class="row" style="margin:8px 0 12px"><button onclick="rUndo('${id}')">↶ Undo</button><button class="primary" onclick="rAccept('${id}')">✓ Accept</button></div>` : ''}
    ${qs.map(q => `<div class="card">${questionBox(q, true)}</div>`).join('')}
    ${dCard(id)}${it.edited ? '' : '<p class="muted">Editing this marks it as yours; the AI will never overwrite it.</p>'}</div></aside>`;
}
function deskB() { return `<div class="dgrid b-grid">${bRail()}${paperPane('sc-b-canvas', 'b-canvas')}${bInspector()}</div>`; }

// ---------- Variant C: paper + AI copilot feed, edit in a dialog ----------
function cOpen(t) { S.ui.modal = t; render(); }
function cClose() { S.ui.modal = null; render(); }
function cPilotTop() { document.getElementById('sc-c-pilot')?.scrollTo({ top: 0, behavior: 'smooth' }); }
function cPilot() {
  const qs = S.questions.filter(q => q.status === 'open' || q.status === 'pending'), cs = changes(), n = pendingCount();
  const g = S.generation;
  return `<aside class="scr c-pilot" id="sc-c-pilot"><div class="ph"><div class="av">✨</div><div class="grow"><b>CV assistant</b><div class="muted" style="font-size:12px">I only use facts from you. Gaps become questions.</div></div></div>
    <div class="bub">${running() && g.kind === 'answer' ? `<div class="row"><div class="spin"></div><div>Applying your answers to ${g.scope.length} part${g.scope.length === 1 ? '' : 's'}…</div></div>`
      : `I wrote your CV for <b>Senior Backend Engineer</b>. ${qs.length ? `I wasn't sure about <b>${qs.length} thing${qs.length === 1 ? '' : 's'}</b>, so I left ${qs.length === 1 ? 'it' : 'them'} out instead of guessing.` : 'Nothing left to ask. You can download it, or keep editing.'}`}</div>
    ${cs.length ? `<h2 class="sec">Review my changes (${cs.length})</h2>${cs.map(id => `<div class="chg ${S.ui.rSel === id ? 'sel' : ''}"><button class="link grow" style="text-align:left;padding:0" onclick="rSelect('${id}')">✨ ${esc(nm(id))}</button><button onclick="rUndo('${id}')">↶</button><button class="primary" onclick="rAccept('${id}')">✓</button></div>`).join('')}<button class="link" onclick="rAcceptAll()">Accept all</button>` : ''}
    ${qs.length ? '<h2 class="sec">Questions</h2>' : ''}${qs.map(q => `<div class="bub q"><button class="link" style="padding:0;font-size:12px" onclick="aLocate('${q.anchor.item || q.anchor.section}')">📍 ${esc(anchorLabel(q.anchor))}</button>${questionBox(q, true)}</div>`).join('')}
    <div class="pfoot">${updateBtn('')}<div class="muted" style="margin-top:6px">${n ? `${n} answer${n === 1 ? '' : 's'} ready to apply.` : 'Answer a question to enable the update.'}</div></div></aside>`;
}
function cModal() {
  const t = S.ui.modal; if (!t) return '';
  const sec = t === 'experience' || t === 'education';
  const body = sec ? S.cv[t].map(e => dCard(e.id)).join('') + `<button class="add" onclick="addItem('${t}')">+ Add ${t}</button>` : dCard(t);
  return `<div class="overlay" onclick="cClose()"><div class="dialog scr" id="sc-modal" onclick="event.stopPropagation()"><div class="dhead"><b>Edit ${sec ? t : nm(t)}</b><button class="primary" onclick="cClose()">Done</button></div><div class="pad">${body}</div></div></div>`;
}
function deskC() { return `<div class="dgrid c-grid">${paperPane('sc-c-doc', 'c-doc', false)}${cPilot()}</div>${cModal()}`; }

function deskEditor() { return dHeader() + (variant === 'A' ? deskA() : variant === 'B' ? deskB() : deskC()); }
function switcher() { return isDesk() && S.screen === 'editor' ? `<button onclick="cycleV(-1)" aria-label="Previous variant">‹</button><span><b>${variant}</b> · ${VARIANTS[variant]}</span><button onclick="cycleV(1)" aria-label="Next variant">›</button>` : ''; }

// ---------- prototype chrome ----------
function go(screen) { S.screen = screen; render(); }
function retrySave(id) { saveItem(id, {}); }
function simPanel() {
  const s = S.sim;
  const snap = { screen: S.screen, tab: S.ui.cTab, generation: S.generation, saves: S.saves, questions: S.questions.map(q => `${q.id}:${q.status}`), revs: Object.fromEntries(ITEM_IDS().map(id => [id, `${itemById(id).rev}${itemById(id).edited ? '✎' : ''}${itemById(id).review ? '✨' : ''}`])) };
  return `<button onclick="S.sim.open=!S.sim.open;render()">Sim ${s.open ? '▴' : '▾'}</button>${s.open ? `<div class="panel">
    <div>Screens: <button onclick="go('list')">CV list</button><button onclick="go('new')">New CV</button><button onclick="startInitial()">Generating</button><button onclick="go('failed')">Failed</button><button onclick="go('editor')">Editor</button></div>
    <label><input type="checkbox" style="width:auto" ${s.saveFails ? 'checked' : ''} onchange="S.sim.saveFails=this.checked;render()"> Saves fail (network/409)</label>
    <label><input type="checkbox" style="width:auto" ${s.answerRunFails ? 'checked' : ''} onchange="S.sim.answerRunFails=this.checked;render()"> “Update CV” run fails</label>
    <label><input type="checkbox" style="width:auto" ${s.initialFails ? 'checked' : ''} onchange="S.sim.initialFails=this.checked;render()"> Initial generation fails</label>
    <button onclick="S.cv=initialCv();S.questions=initialQuestions();S.saves={};S.generation=null;render()">Reset data</button>
    <pre>${esc(JSON.stringify(snap, null, 1))}</pre></div>` : ''}`;
}
function render() {
  const app = document.getElementById('app');
  const keep = {}; document.querySelectorAll('.scr[id]').forEach(e => { keep[e.id] = e.scrollTop; });
  const scroll = window.scrollY, desk = isDesk(), dEd = desk && S.screen === 'editor';
  const known = t => t && (t === 'experience' || t === 'education' || ITEM_IDS().includes(t));
  if (!known(S.ui.sel)) S.ui.sel = null; if (!known(S.ui.modal)) S.ui.modal = null;
  document.body.className = desk ? 'v' + variant : '';
  app.className = dEd ? 'dwrap v' + variant : 'phone' + (desk ? ' wide' : '');
  app.innerHTML = S.screen === 'list' ? screenList() : S.screen === 'new' ? screenNew() : S.screen === 'generating' ? screenGenerating() : S.screen === 'failed' ? screenFailed() : dEd ? deskEditor() : editorScreen();
  window.scrollTo(0, scroll);
  for (const [id, t] of Object.entries(keep)) { const e = document.getElementById(id); if (e) e.scrollTop = t; }
  if (S.ui.focus) { document.getElementById(S.ui.focus)?.focus(); S.ui.focus = null; }
  document.getElementById('sim').innerHTML = simPanel();
  document.getElementById('vsw').innerHTML = switcher();
}
render();
</script>
</body>
</html>

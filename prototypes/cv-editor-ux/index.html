<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers wayfinder ticket "Mobile-friendly CV editor UX" (#11).
  Agreed shape (variant C): paper preview + bottom tabs CV | Edit | Questions. Variants A
  (inline document) and B (section tabs + sheets) were dropped; they live in this branch's
  history (commit 0fddffd). Other screens: CV list, New CV, Generating, Failed.
  No backend: all state is in memory; the "Sim" panel forces states (save error, failures).
  Open on a phone or in a 375px viewport. Never merge into main.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Editor Prototype</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --ink: #1c1c1e; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #2f5bea; --accent-ink: #fff; --warn-bg: #fff6dc; --warn-line: #f0c94a; --warn-ink: #6b5200;
    --err-bg: #fde8e8; --err-ink: #9b1c1c; --ok: #1d7a46; --pending-bg: #e8efff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9d9d6; font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  .phone { max-width: 420px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; padding-bottom: 240px; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  header.top h1 { font-size: 16px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header.top .sub { font-size: 12px; color: var(--muted); font-weight: normal; display: block; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 14px; min-height: 40px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.link { border: 0; background: none; color: var(--accent); padding: 4px 6px; min-height: 0; }
  button.icon { padding: 6px 10px; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; background: #fff; }
  textarea { resize: vertical; min-height: 64px; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .pad { padding: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eee; color: var(--muted); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .chip.err { background: var(--err-bg); color: var(--err-ink); }
  .chip.ok { background: #e3f4ea; color: var(--ok); }
  .chip.run { background: var(--pending-bg); color: var(--accent); }
  .q { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 14px; }
  .q.pending { background: var(--pending-bg); border-color: #b9cbff; }
  .q .qt { font-weight: 600; color: var(--warn-ink); }
  .q.pending .qt { color: var(--accent); }
  .banner { padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .banner.err { background: var(--err-bg); color: var(--err-ink); }
  .banner.run { background: var(--pending-bg); color: var(--accent); }
  .shimmer { position: relative; opacity: .55; pointer-events: none; }
  .shimmer::after { content: "Updating…"; position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--accent); background: var(--pending-bg); padding: 1px 6px; border-radius: 99px; }
  .edited { font-size: 11px; color: var(--muted); }
  h2.sec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
  ul.b { margin: 6px 0 0; padding-left: 18px; }
  ul.b li { margin: 2px 0; }
  .save { font-size: 12px; }
  .save.err { color: var(--err-ink); }
  .save.ok { color: var(--ok); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; }
  .seg button.on { background: var(--ink); color: #fff; }
  .steps li { margin: 6px 0; list-style: none; }
  .steps { padding: 0; }
  .paper { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.12); padding: 22px 20px; margin: 12px; font-family: Georgia, serif; font-size: 13px; }
  .paper h3 { font: 600 11px/1 -apple-system, system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin: 16px 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .paper .pen { font: 12px -apple-system, system-ui, sans-serif; letter-spacing: 0; text-transform: none; color: var(--accent); border: 0; background: none; padding: 0 4px; min-height: 0; }
  .hl { background: #fff1b8; outline: 2px solid var(--warn-line); border-radius: 3px; }
  .qmark { display: inline-block; font: 600 10px -apple-system, system-ui, sans-serif; color: var(--warn-ink); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 99px; padding: 0 5px; margin-left: 4px; cursor: pointer; }
  .li { display: flex; gap: 6px; align-items: flex-start; margin: 6px 0; }
  .li textarea, .li input { flex: 1; min-height: 40px; }
  .x { min-height: 40px; padding: 0 10px; color: var(--muted); }
  .add { width: 100%; border-style: dashed; color: var(--accent); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chips span { background: #eef1f6; border-radius: 99px; padding: 4px 4px 4px 10px; font-size: 14px; display: inline-flex; align-items: center; gap: 2px; }
  .chips span button { border: 0; background: none; min-height: 0; padding: 0 6px; color: var(--muted); }
  .chead { display: flex; align-items: center; margin-bottom: -4px; }
  .chead b { flex: 1; font-size: 12px; color: var(--muted); font-weight: 600; }
  .loader { position: sticky; top: 70px; z-index: 3; margin: 12px; background: var(--card); border: 1px solid #b9cbff; border-radius: 12px; padding: 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 14px rgba(47,91,234,.15); }
  .spin { width: 26px; height: 26px; border: 3px solid var(--pending-bg); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .paper.busy { opacity: .6; }
  .flash { animation: flash 2.5s ease-out; }
  @keyframes flash { 0%, 40% { background: #d9f2e3; } 100% { background: transparent; } }
  del.dd { background: #fde8e8; color: #9b1c1c; text-decoration: line-through; }
  ins.di { background: #d9f2e3; color: #1d5e36; text-decoration: none; }
  .changed { border-left: 3px solid #2fa865; padding-left: 6px; margin-left: -9px; cursor: pointer; }
  .changed.sel { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .rbar { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); width: min(420px,100%); background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 12px rgba(0,0,0,.08); padding: 8px 12px; z-index: 6; }
  .rbar .row button { min-height: 36px; padding: 6px 12px; }
  .bnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(420px,100%); background: var(--card); border-top: 1px solid var(--line); display: flex; z-index: 6; }
  .bnav button { flex: 1; border: 0; border-radius: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); font-size: 13px; }
  .bnav button.on { color: var(--accent); font-weight: 600; }
  /* prototype chrome (not part of the design) */
  #sim { position: fixed; top: 120px; right: 8px; z-index: 51; font-size: 12px; }
  #sim > button { background: #111; color: #fff; border: 0; border-radius: 99px; min-height: 30px; padding: 4px 12px; }
  #sim .panel { background: #111; color: #eee; border-radius: 12px; padding: 10px; margin-top: 6px; width: 290px; max-height: 70vh; overflow: auto; }
  #sim .panel button { background: #333; color: #fff; border: 0; min-height: 28px; padding: 3px 8px; margin: 2px; font-size: 12px; border-radius: 6px; }
  #sim pre { white-space: pre-wrap; font-size: 10.5px; color: #9fe39f; margin: 8px 0 0; }
  #sim label { display: block; margin: 4px 0; }
</style>
</head>
<body>
<div class="phone" id="app"></div>
<div id="sim"></div>
<script>
// ---------- in-memory state ----------

const initialCv = () => ({
  contact: { id: 'contact', rev: 1, edited: false, name: 'Olena Kovalenko', email: 'olena.k@example.com', phone: '+380 67 123 4567', location: 'Lviv, Ukraine', links: ['https://github.com/olenak'] },
  summary: { id: 'summary', rev: 1, edited: false, text: 'Backend engineer with 6 years of Node.js and PostgreSQL experience, focused on payment systems and high-load APIs. Targeting a Senior Backend Engineer role.' },
  experience: [
    { id: 'e1', rev: 1, edited: false, title: 'Backend Engineer', org: 'PayFlow', dates: '2021 – present', bullets: ['Built the payment authorisation service in NestJS and PostgreSQL', 'Cut p95 latency of the checkout API by moving reads to a replica', 'Mentored two junior engineers'] },
    { id: 'e2', rev: 1, edited: false, title: 'Freelance Node.js developer', org: null, dates: null, bullets: ['Delivered REST APIs for small e-commerce clients'] },
    { id: 'e3', rev: 1, edited: false, title: 'Junior Developer', org: 'SoftServe', dates: '2018 – 2020', bullets: ['Maintained internal reporting tools in Express'] },
  ],
  education: [ { id: 'ed1', rev: 1, edited: false, degree: 'BSc Computer Science', school: 'Lviv Polytechnic', dates: null } ],
  skills: { id: 'skills', rev: 1, edited: false, items: ['Node.js', 'TypeScript', 'NestJS', 'PostgreSQL', 'Redis', 'Docker'] },
});
const initialQuestions = () => ([
  { id: 'q1', anchor: { section: 'experience', item: 'e1', field: 'bullets' }, text: 'How much did the p95 latency of the checkout API drop?', status: 'open', answer: '' },
  { id: 'q2', anchor: { section: 'experience', item: 'e2', field: 'dates' }, text: 'When did you freelance, and for which clients or platform?', status: 'open', answer: '' },
  { id: 'q3', anchor: { section: 'education', item: 'ed1', field: 'dates' }, text: 'Did you complete the degree? In which year?', status: 'open', answer: '' },
  { id: 'q4', anchor: { section: 'skills' }, text: 'Do you have hands-on experience with any message queue (Kafka, RabbitMQ, SQS)?', status: 'open', answer: '' },
]);

let S = {
  screen: 'editor',            // list | new | generating | failed | editor
  newSource: 'pdf',
  generation: null,            // { kind: 'initial'|'answer', step, status, errorCode, scope: [itemIds] }
  cv: initialCv(),
  questions: initialQuestions(),
  saves: {},                   // itemId -> 'saving' | 'saved' | 'error'
  sim: { saveFails: false, answerRunFails: false, initialFails: false, open: false },
  ui: { cTab: 'preview', hl: null, rSel: null, focus: null },
};

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const itemById = id => {
  const c = S.cv;
  if (id === 'contact') return c.contact; if (id === 'summary') return c.summary; if (id === 'skills') return c.skills;
  return c.experience.find(x => x.id === id) || c.education.find(x => x.id === id);
};
const qFor = (id) => S.questions.filter(q => (q.anchor.item || q.anchor.section) === id && (q.status === 'open' || q.status === 'pending'));
const qForSection = (sec) => S.questions.filter(q => q.anchor.section === sec && (q.status === 'open' || q.status === 'pending'));
const pendingCount = () => S.questions.filter(q => q.status === 'pending').length;
const openCount = () => S.questions.filter(q => q.status === 'open' || q.status === 'pending').length;
const running = () => S.generation && (S.generation.status === 'queued' || S.generation.status === 'running');
const inScope = id => running() && S.generation.kind === 'answer' && S.generation.scope.includes(id);
const anchorLabel = a => {
  if (a.item) { const it = itemById(a.item); const name = it.title ? `${it.title}${it.org ? ' @ ' + it.org : ''}` : it.degree || a.section; return `${cap(a.section)} › ${name}${a.field ? ' › ' + a.field : ''}`; }
  return cap(a.section);
};
const cap = s => s[0].toUpperCase() + s.slice(1);

// Simulated item operation: one item, base rev, may fail.
function saveItem(id, patch) {
  const it = itemById(id); Object.assign(it, patch); // optimistic: keep the user's text on screen
  if (it.review) { it.review = false; delete it.prev; } // editing a changed item by hand accepts the change
  S.saves[id] = 'saving'; render();
  setTimeout(() => {
    if (S.sim.saveFails) { S.saves[id] = 'error'; render(); return; }
    it.rev++; it.edited = true;
    S.saves[id] = 'saved'; render();
  }, 700);
}
function setAnswer(qid, text) { const q = S.questions.find(x => x.id === qid); q.answer = text; q.status = text.trim() ? 'pending' : 'open'; render(); }
function dismissQ(qid) { S.questions.find(x => x.id === qid).status = 'dismissed'; render(); }

function startAnswerRun() {
  const pend = S.questions.filter(q => q.status === 'pending');
  const scope = [...new Set(pend.map(q => q.anchor.item || q.anchor.section))].filter(id => !itemById(id)?.edited);
  S.generation = { kind: 'answer', status: 'running', step: 'compose', scope };
  S.ui.cTab = 'preview'; S.ui.hl = null; window.scrollTo(0, 0); // show the CV being updated
  render();
  setTimeout(() => { if (S.generation) { S.generation.step = 'judge'; render(); } }, 1500);
  setTimeout(() => {
    if (S.sim.answerRunFails) { S.generation = { ...S.generation, status: 'failed', errorCode: 'llm_unavailable' }; render(); return; }
    for (const q of pend) {
      q.status = 'answered';
      const it = itemById(q.anchor.item || q.anchor.section);
      if (!it.review) { it.prev = snapshot(it); it.review = true; } // applied, but awaits Accept / Undo
      if (q.id === 'q1') it.bullets[1] = 'Cut p95 latency of the checkout API from 800 ms to 250 ms by moving reads to a replica';
      if (q.id === 'q2') { it.dates = q.answer.match(/\d{4}.*\d{4}/)?.[0] || '2020 – 2021'; it.org = 'Upwork'; }
      if (q.id === 'q3') it.dates = q.answer.match(/\d{4}/)?.[0] || '2018';
      if (q.id === 'q4') it.items = [...it.items, 'RabbitMQ'];
      it.rev++;
    }
    S.generation = { ...S.generation, status: 'succeeded' };
    render();
    setTimeout(() => { if (S.generation?.status === 'succeeded') { S.generation = null; render(); } }, 2500);
  }, 3500);
}
function startInitial() {
  S.screen = 'generating'; S.generation = { kind: 'initial', status: 'queued', step: null, started: Date.now() }; render();
  const steps = [['running','extract',1200],['running','compose',3000],['running','judge',5000]];
  for (const [st, step, t] of steps) setTimeout(() => { if (S.screen === 'generating') { S.generation.status = st; S.generation.step = step; render(); } }, t);
  setTimeout(() => {
    if (S.screen !== 'generating') return;
    if (S.sim.initialFails) { S.generation = { kind: 'initial', status: 'failed', errorCode: 'llm_unavailable' }; S.screen = 'failed'; }
    else { S.generation = null; S.cv = initialCv(); S.questions = initialQuestions(); S.screen = 'editor'; }
    render();
  }, 7000);
}

// ---------- shared screens ----------
function topBar(title, sub, right = '') {
  return `<header class="top"><button class="icon" onclick="go('list')" aria-label="Back">‹</button><h1>${esc(title)}<span class="sub">${sub}</span></h1>${right}</header>`;
}
function saveLabel(id) {
  const s = S.saves[id];
  if (s === 'saving') return `<span class="save">Saving…</span>`;
  if (s === 'error') return `<span class="save err">Couldn't save. <button class="link" onclick="retrySave('${id}')">Retry</button></span>`;
  if (s === 'saved') return `<span class="save ok">Saved</span>`;
  return '';
}
function errorText(code) {
  return { llm_unavailable: 'The AI service is not responding right now. Your source is saved, so trying again is safe.' }[code] || 'Something went wrong.';
}
function screenList() {
  return `<header class="top"><h1>My CVs<span class="sub">olena.k@example.com</span></h1><button class="primary" onclick="go('new')">+ New</button></header>
  <div class="pad">
    <div class="card" onclick="go('editor')" style="cursor:pointer"><div class="row"><b class="grow">Senior Backend Engineer</b><span class="chip warn">${openCount()} questions</span></div><div class="muted">From PDF · edited today</div></div>
    <div class="card"><div class="row"><b class="grow">Tech Lead</b><span class="chip run">Generating… 40%</span></div><div class="muted">From text · started 1 min ago</div></div>
    <div class="card"><div class="row"><b class="grow">Platform Engineer</b><span class="chip err">Failed</span></div><div class="muted">From PDF · <button class="link" onclick="go('failed')">Try again</button></div></div>
  </div>`;
}
function screenNew() {
  const pdf = S.newSource === 'pdf';
  return `${topBar('New CV', 'Step 1 of 1')}
  <div class="pad">
    <label class="f">Target role</label><input placeholder="e.g. Senior Backend Engineer" value="Senior Backend Engineer">
    <label class="f">Your background</label>
    <div class="seg"><button class="${pdf ? 'on' : ''}" onclick="S.newSource='pdf';render()">Upload PDF</button><button class="${pdf ? '' : 'on'}" onclick="S.newSource='text';render()">Describe in text</button></div>
    ${pdf ? `<div class="card" style="text-align:center;border-style:dashed"><div style="font-size:28px">📄</div><button>Choose PDF</button><div class="muted" style="margin-top:6px">Up to 5 MB and 5 pages. Scans are fine.</div></div>`
          : `<textarea rows="8" placeholder="Where you worked, what you did, education, skills… Plain sentences are fine."></textarea><div class="muted">0 / 20 000 characters</div>`}
    <p class="muted">We only use what you give us. Anything missing becomes a question, never a guess.</p>
    <button class="primary" style="width:100%" onclick="startInitial()">Generate CV</button>
  </div>`;
}
function screenGenerating() {
  const g = S.generation, order = ['extract','compose','judge'];
  const labels = { extract: 'Reading your background', compose: 'Writing the CV for the role', judge: 'Checking every line against your facts' };
  const idx = g.step ? order.indexOf(g.step) : -1;
  return `${topBar('Senior Backend Engineer', g.status === 'queued' ? 'Queued' : 'Generating…')}
  <div class="pad">
    <div class="card"><b>Generating your CV</b><p class="muted">Usually under a minute. You can close this page or reload; the CV keeps generating and will be here when you're back, on any device.</p>
    <ul class="steps">${order.map((s, i) => `<li>${i < idx ? '✅' : i === idx ? '⏳' : '◻️'} ${labels[s]}</li>`).join('')}</ul></div>
    <button style="width:100%" onclick="go('list')">Back to my CVs</button>
  </div>`;
}
function screenFailed() {
  return `${topBar('Platform Engineer', 'Generation failed')}
  <div class="pad"><div class="card"><b>We couldn't generate this CV</b><p class="muted">${errorText('llm_unavailable')}</p><div class="muted">Error code: llm_unavailable</div></div>
  <button class="primary" style="width:100%" onclick="startInitial()">Try again</button>
  <button style="width:100%;margin-top:8px" onclick="go('list')">Back to my CVs</button></div>`;
}
function runBanner() {
  const g = S.generation; if (!g || g.kind !== 'answer') return '';
  if (running()) return `<div class="banner run">Updating ${g.scope.length} part${g.scope.length === 1 ? '' : 's'} with your answers (${g.step === 'judge' ? 'checking facts' : 'writing'})… You can keep editing other parts.</div>`;
  if (g.status === 'failed') return `<div class="banner err">Couldn't apply your answers: ${errorText(g.errorCode)} Your answers are kept. <button class="link" onclick="startAnswerRun()">Try again</button></div>`;
  if (g.status === 'succeeded') return `<div class="banner run">✅ CV updated with your answers. Review the highlighted changes.</div>`;
  return '';
}
function questionBox(q, compact) {
  if (q.status === 'pending') return `<div class="q pending"><div class="qt">Answer saved · not applied yet</div><div>${esc(q.text)}</div><textarea onchange="setAnswer('${q.id}', this.value)">${esc(q.answer)}</textarea><div class="muted">Applied when you tap “Update CV”.</div></div>`;
  return `<div class="q"><div class="qt">❓ ${compact ? '' : 'Question'}</div><div>${esc(q.text)}</div><textarea placeholder="Your answer" onchange="setAnswer('${q.id}', this.value)"></textarea><div class="row"><span class="grow"></span><button class="link" onclick="dismissQ('${q.id}')">Not relevant</button></div></div>`;
}
function updateBtn(extraClass = '') {
  const n = pendingCount();
  return `<button class="primary ${extraClass}" ${n === 0 || running() ? 'disabled' : ''} onclick="startAnswerRun()">Update CV${n ? ` (${n})` : ''}</button>`;
}
function downloadBtn(label = '⬇ PDF') { return `<button onclick="alert('GET /api/cvs/:id/pdf → A4 PDF download')">${label}</button>`; }

// ---------- autosave: one item operation per change ----------
let saveTimers = {};
function queueSave(id, patch) { clearTimeout(saveTimers[id]); saveTimers[id] = setTimeout(() => saveItem(id, patch), 300); }

// ---------- Variant C: paper preview + questions inbox ----------
function cMark(id) { const qs = qFor(id); return qs.length ? `<span class="qmark" onclick="S.ui.cTab='questions';render()">?${qs.length}</span>` : ''; }
function cPaper() {
  const c = S.cv, hl = S.ui.hl;
  const h = id => (hl === id ? 'hl' : '') + (inScope(id) ? ' shimmer' : '') + (itemById(id).review ? ' changed' + (S.ui.rSel === id ? ' sel' : '') : '');
  const on = id => `id="p-${id}"` + (itemById(id).review ? ` onclick="rSelect('${id}')"` : '');
  const pen = sec => `<button class="pen" onclick="event.stopPropagation();cGoEdit('${sec}')">✎ Edit</button>`;
  const ct = c.contact;
  return `${cLoader()}<div class="paper ${running() && S.generation.kind === 'answer' ? 'busy' : ''}">
    <div class="${h('contact')}" ${on('contact')}><div class="row"><div class="grow" style="font-size:20px;font-weight:600">${F(ct, 'name')}</div>${pen('contact')}</div><div style="font-size:11px">${F(ct, 'email')} · ${F(ct, 'phone')} · ${F(ct, 'location')} · ${F(ct, 'links')}</div></div>
    <h3>Summary ${pen('summary')}</h3><div class="${h('summary')}" ${on('summary')}>${F(c.summary, 'text')}</div>
    <h3>Experience ${pen('experience')}</h3>${c.experience.filter(e => e.title || e.prev).map(e => `<div class="${h(e.id)}" ${on(e.id)} style="margin-bottom:8px"><b>${F(e, 'title')}</b>${e.org || e.prev?.org ? ', ' + F(e, 'org') : ''} ${cMark(e.id)}<div style="font-size:11px;color:#666">${F(e, 'dates')}</div><ul class="b">${FB(e)}</ul></div>`).join('')}
    <h3>Education ${pen('education')}</h3>${c.education.filter(e => e.degree || e.prev).map(e => `<div class="${h(e.id)}" ${on(e.id)}><b>${F(e, 'degree')}</b>, ${F(e, 'school')} ${F(e, 'dates')} ${cMark(e.id)}</div>`).join('')}
    <h3>Skills ${pen('skills')}</h3><div class="${h('skills')}" ${on('skills')}>${F(c.skills, 'items', ', ')} ${cMark('skills')}</div>
    <p style="font:11px -apple-system,sans-serif;color:#999;margin-top:14px">This is exactly what the PDF will look like.</p>
  </div>`;
}
// ---- review of AI changes: word diff against the item's previous snapshot ----
const ITEM_IDS = () => ['contact', 'summary', ...S.cv.experience.map(e => e.id), ...S.cv.education.map(e => e.id), 'skills'];
const changes = () => ITEM_IDS().filter(id => itemById(id).review);
function snapshot(it) { const { prev, review, ...rest } = it; return JSON.parse(JSON.stringify(rest)); }
function diffWords(a, b) {
  const tok = v => String(v ?? '').split(/(\s+|[,;·])/).filter(Boolean); // punctuation is its own token
  const x = tok(a), y = tok(b);
  const L = Array.from({ length: x.length + 1 }, () => new Array(y.length + 1).fill(0));
  for (let i = x.length - 1; i >= 0; i--) for (let j = y.length - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = '';
  while (i < x.length && j < y.length) {
    if (x[i] === y[j]) { out += esc(x[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { out += `<del class="dd">${esc(x[i++])}</del>`; }
    else { out += `<ins class="di">${esc(y[j++])}</ins>`; }
  }
  while (i < x.length) out += `<del class="dd">${esc(x[i++])}</del>`;
  while (j < y.length) out += `<ins class="di">${esc(y[j++])}</ins>`;
  return out;
}
// Field as HTML: plain when unchanged, word diff when the item awaits review.
const J = (v, sep) => Array.isArray(v) ? v.filter(Boolean).join(sep) : v;
const F = (it, f, sep = ' · ') => it.review && it.prev ? diffWords(J(it.prev[f], sep), J(it[f], sep)) : esc(J(it[f], sep));
const FB = it => it.bullets.filter(Boolean).map((b, k) => `<li>${it.review && it.prev ? diffWords(it.prev.bullets[k], b) : esc(b)}</li>`).join('')
  + (it.review && it.prev ? it.prev.bullets.slice(it.bullets.length).map(b => `<li><del class="dd">${esc(b)}</del></li>`).join('') : '');
function rSelect(id) { S.ui.rSel = id; render(); document.getElementById('p-' + id)?.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
function rStep(d) { const cs = changes(); const k = Math.max(0, cs.indexOf(S.ui.rSel)); rSelect(cs[(k + d + cs.length) % cs.length]); }
function rAccept(id) { const it = itemById(id); it.review = false; delete it.prev; it.rev++; rNext(); }
function rUndo(id) {
  const it = itemById(id); Object.assign(it, it.prev); it.review = false; delete it.prev; it.rev++;
  S.questions.forEach(q => { if ((q.anchor.item || q.anchor.section) === id && q.status === 'answered') q.status = 'pending'; }); // answer kept, editable, re-applied by Update CV
  rNext();
}
function rAcceptAll() { changes().forEach(id => { const it = itemById(id); it.review = false; delete it.prev; it.rev++; }); S.ui.rSel = null; render(); }
function rNext() { const cs = changes(); S.ui.rSel = cs[0] || null; render(); if (cs[0]) document.getElementById('p-' + cs[0])?.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
function rBar() {
  const cs = changes(); if (!cs.length || running()) return '';
  if (!cs.includes(S.ui.rSel)) S.ui.rSel = cs[0];
  const k = cs.indexOf(S.ui.rSel), it = itemById(S.ui.rSel);
  const name = it.title || it.degree || cap(S.ui.rSel);
  return `<div class="rbar">
    <div class="row" style="font-size:13px"><b class="grow">✨ AI change ${k + 1} of ${cs.length}</b><button class="link" onclick="rAcceptAll()">Accept all</button></div>
    <div class="muted" style="margin:2px 0 6px">${esc(name)}</div>
    <div class="row"><button onclick="rStep(-1)" aria-label="Previous change">‹</button><button onclick="rStep(1)" aria-label="Next change">›</button><span class="grow"></span><button onclick="rUndo('${S.ui.rSel}')">↶ Undo</button><button class="primary" onclick="rAccept('${S.ui.rSel}')">✓ Accept</button></div>
  </div>`;
}

// Loader over the preview while an answer Generation runs; text follows the real step.
function cLoader() {
  const g = S.generation;
  if (!g || g.kind !== 'answer' || !running()) return '';
  const text = g.step === 'judge' ? 'Double-checking every line against your answers…' : 'Working our magic on your CV…';
  return `<div class="loader"><div class="spin"></div><div><b>${text}</b><div class="muted">Updating ${g.scope.length} part${g.scope.length === 1 ? '' : 's'}. Safe to leave or reload; you can keep editing other parts.</div></div></div>`;
}
function cInbox() {
  const qs = S.questions.filter(q => q.status === 'open' || q.status === 'pending');
  const done = S.questions.filter(q => q.status === 'answered' || q.status === 'dismissed');
  return `<div class="pad">
    <p class="muted">The AI didn't guess these. Answer what you can; nothing changes until you tap “Update CV”.</p>
    ${qs.map(q => `<div class="card"><div class="row"><button class="link" style="padding:0;font-size:12px" onclick="S.ui.hl='${q.anchor.item || q.anchor.section}';S.ui.cTab='preview';render()">📍 ${esc(anchorLabel(q.anchor))}</button></div>${questionBox(q, true)}</div>`).join('') || '<p class="muted">No open questions 🎉</p>'}
    ${done.length ? `<h2 class="sec">Done</h2>${done.map(q => `<div class="muted">✓ ${esc(q.text)} <i>(${q.status})</i></div>`).join('')}` : ''}
    <div style="margin-top:12px">${updateBtn()}</div>
  </div>`;
}
// ---------- Edit tab: every field, lists you can grow and shrink, per-item autosave ----------
let seq = 1;
const field = (it, f, label, ph = '') => `<label class="f">${label}</label><input value="${esc(it[f])}" placeholder="${it[f] === null ? 'Unknown, see the question' : ph}" onchange="queueSave('${it.id}', { ${f}: this.value })">`;
function listEditor(it, key, label, addLabel, ph, multiline) {
  const rows = it[key].map((v, k) => {
    const fid = `${it.id}-${key}-${k}`;
    const input = multiline
      ? `<textarea id="${fid}" rows="2" placeholder="${ph}" onchange="setListItem('${it.id}','${key}',${k},this.value)">${esc(v)}</textarea>`
      : `<input id="${fid}" value="${esc(v)}" placeholder="${ph}" onchange="setListItem('${it.id}','${key}',${k},this.value)">`;
    return `<div class="li">${input}<button class="x" aria-label="Remove" onclick="removeListItem('${it.id}','${key}',${k})">✕</button></div>`;
  }).join('');
  return `<label class="f">${label}</label>${rows}<button class="add" onclick="addListItem('${it.id}','${key}')">+ ${addLabel}</button>`;
}
function setListItem(id, key, k, v) { const next = [...itemById(id)[key]]; next[k] = v; queueSave(id, { [key]: next }); }
function removeListItem(id, key, k) { const next = itemById(id)[key].filter((_, j) => j !== k); saveItem(id, { [key]: next }); }
function addListItem(id, key) { const it = itemById(id); it[key] = [...it[key], '']; S.ui.focus = `${id}-${key}-${it[key].length - 1}`; render(); } // saved on first blur
function addSkill(input) { const v = input.value.trim(); if (!v) return; saveItem('skills', { items: [...S.cv.skills.items, v] }); S.ui.focus = 'skill-new'; }

function addItem(sec) { // server creates the item (new id, rev 1); a hand-added item is an Edited item from birth
  const id = 'n' + seq++;
  const blank = sec === 'experience' ? { title: '', org: '', dates: '', bullets: [''] } : { degree: '', school: '', dates: '' };
  S.cv[sec].push({ id, rev: 1, edited: true, ...blank });
  S.ui.focus = `${id}-first`; render();
  document.getElementById('edit-' + id)?.scrollIntoView({ block: 'center' });
}
function removeItem(sec, id) {
  const it = itemById(id), name = it.title || it.degree || 'this entry';
  if (!confirm(`Remove “${name}” from the CV?`)) return;
  S.cv[sec] = S.cv[sec].filter(x => x.id !== id);
  S.questions.forEach(q => { if (q.anchor.item === id && (q.status === 'open' || q.status === 'pending')) q.status = 'obsolete'; });
  render();
}
function cardFoot(it) {
  const qs = qFor(it.id);
  return `<div class="row" style="margin-top:8px">${qs.length ? `<button class="link" style="padding:0" onclick="S.ui.cTab='questions';render()"><span class="chip warn">❓ ${qs.length} question${qs.length > 1 ? 's' : ''}</span></button>` : ''}${it.review ? `<button class="link" style="padding:0" onclick="S.ui.cTab='preview';rSelect('${it.id}')"><span class="chip ok">✨ AI change, review</span></button>` : ''}${it.edited ? '<span class="edited">✎ edited by you</span>' : ''}<span class="grow"></span>${saveLabel(it.id)}</div>`;
}
function card(it, body, head = '') { return `<div class="card ${inScope(it.id) ? 'shimmer' : ''}" id="edit-${it.id}">${head}${body}${cardFoot(it)}</div>`; }
function removeHead(sec, it, n) { return `<div class="chead"><b>${sec === 'experience' ? 'Experience' : 'Education'} ${n}</b><button class="link" style="color:var(--err-ink)" onclick="removeItem('${sec}','${it.id}')">Remove</button></div>`; }
function cEditTab() {
  const c = S.cv, ct = c.contact;
  const exp = c.experience.map((e, k) => card(e,
    field(e, 'title', 'Title', 'e.g. Backend Engineer').replace('<input ', `<input id="${e.id}-first" `) + field(e, 'org', 'Organisation', 'Company, client or project') + field(e, 'dates', 'Dates', 'e.g. 2021 – present')
    + listEditor(e, 'bullets', 'Bullets', 'Add bullet', 'One concise achievement', true), removeHead('experience', e, k + 1))).join('');
  const edu = c.education.map((e, k) => card(e,
    field(e, 'degree', 'Degree', 'e.g. BSc Computer Science').replace('<input ', `<input id="${e.id}-first" `) + field(e, 'school', 'School') + field(e, 'dates', 'Year(s)', 'e.g. 2014 – 2018'),
    removeHead('education', e, k + 1))).join('');
  const skills = card(c.skills, `<div class="chips">${c.skills.items.map((v, k) => `<span>${esc(v)}<button aria-label="Remove ${esc(v)}" onclick="removeListItem('skills','items',${k})">✕</button></span>`).join('')}</div>
    <div class="li"><input id="skill-new" placeholder="Add a skill" enterkeyhint="done" onkeydown="if(event.key==='Enter'){addSkill(this)}"><button class="x" onclick="addSkill(document.getElementById('skill-new'))">Add</button></div>`);
  return `<div class="pad">
    <p class="muted">Changes save automatically. The AI never rewrites anything you edited or added.</p>
    <h2 class="sec" id="edit-sec-contact">Contact</h2>${card(ct, field(ct, 'name', 'Full name') + field(ct, 'email', 'Email') + field(ct, 'phone', 'Phone') + field(ct, 'location', 'Location', 'City, country')
      + listEditor(ct, 'links', 'Links', 'Add link', 'https://linkedin.com/in/…', false) + `<div class="muted">Only https:// and http:// links become clickable in the PDF.</div>`)}
    <h2 class="sec" id="edit-sec-summary">Summary</h2>${card(c.summary, `<textarea rows="5" onchange="queueSave('summary', { text: this.value })">${esc(c.summary.text)}</textarea>`)}
    <h2 class="sec" id="edit-sec-experience">Experience</h2>${exp}<button class="add" onclick="addItem('experience')">+ Add experience</button>
    <h2 class="sec" id="edit-sec-education">Education</h2>${edu}<button class="add" onclick="addItem('education')">+ Add education</button>
    <h2 class="sec" id="edit-sec-skills">Skills</h2>${skills}
  </div>`;
}
function cGoEdit(sec) { S.ui.cTab = 'edit'; render(); document.getElementById('edit-sec-' + sec)?.scrollIntoView(); window.scrollBy(0, -70); }
function editorScreen() {
  const t = S.ui.cTab, n = openCount();
  const cs = changes(); if (cs.length && !cs.includes(S.ui.rSel)) S.ui.rSel = cs[0]; // select before the paper renders
  const tab = (key, label) => `<button class="${t === key ? 'on' : ''}" onclick="S.ui.cTab='${key}';S.ui.hl=null;window.scrollTo(0,0);render()">${label}</button>`;
  return `${topBar('Senior Backend Engineer', 'Ready', downloadBtn())}${t === 'preview' && running() ? '' : runBanner()}
  ${t === 'preview' ? cPaper() + rBar() : t === 'edit' ? cEditTab() : cInbox()}
  <nav class="bnav">${tab('preview', '📄 CV')}${tab('edit', '✎ Edit')}${tab('questions', `❓ Questions${n ? ` (${n})` : ''}`)}</nav>`;
}

// ---------- prototype chrome ----------
function go(screen) { S.screen = screen; render(); }
function retrySave(id) { saveItem(id, {}); }
function simPanel() {
  const s = S.sim;
  const snap = { screen: S.screen, tab: S.ui.cTab, generation: S.generation, saves: S.saves, questions: S.questions.map(q => `${q.id}:${q.status}`), revs: Object.fromEntries(ITEM_IDS().map(id => [id, `${itemById(id).rev}${itemById(id).edited ? '✎' : ''}${itemById(id).review ? '✨' : ''}`])) };
  return `<button onclick="S.sim.open=!S.sim.open;render()">Sim ${s.open ? '▴' : '▾'}</button>${s.open ? `<div class="panel">
    <div>Screens: <button onclick="go('list')">CV list</button><button onclick="go('new')">New CV</button><button onclick="startInitial()">Generating</button><button onclick="go('failed')">Failed</button><button onclick="go('editor')">Editor</button></div>
    <label><input type="checkbox" style="width:auto" ${s.saveFails ? 'checked' : ''} onchange="S.sim.saveFails=this.checked;render()"> Saves fail (network/409)</label>
    <label><input type="checkbox" style="width:auto" ${s.answerRunFails ? 'checked' : ''} onchange="S.sim.answerRunFails=this.checked;render()"> “Update CV” run fails</label>
    <label><input type="checkbox" style="width:auto" ${s.initialFails ? 'checked' : ''} onchange="S.sim.initialFails=this.checked;render()"> Initial generation fails</label>
    <button onclick="S.cv=initialCv();S.questions=initialQuestions();S.saves={};S.generation=null;render()">Reset data</button>
    <pre>${esc(JSON.stringify(snap, null, 1))}</pre></div>` : ''}`;
}
function render() {
  const app = document.getElementById('app');
  const scroll = window.scrollY;
  app.innerHTML = S.screen === 'list' ? screenList() : S.screen === 'new' ? screenNew() : S.screen === 'generating' ? screenGenerating() : S.screen === 'failed' ? screenFailed() : editorScreen();
  window.scrollTo(0, scroll);
  if (S.ui.focus) { document.getElementById(S.ui.focus)?.focus(); S.ui.focus = null; }
  document.getElementById('sim').innerHTML = simPanel();
}
render();
</script>
</body>

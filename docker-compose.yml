# Starts db → api → web; each waits until the previous one is healthy.
# Only the web app is published: the browser reaches the API through its /api/* rewrite.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'cv', '-d', 'cv']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://cv:cv@db:5432/cv
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY (see .env.example)}
      APP_ORIGIN: http://localhost:3000
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 40
    init: true
    ipc: host
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 20
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata:
